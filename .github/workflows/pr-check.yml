name: PR check

# One quick compile per pull request push. The manual CI stays as it is:
# dispatched at a work-unit boundary, one run for the whole repo. What that
# lane cannot give a PR is a fast answer, because its concurrency group is
# repo-global and parallel sessions' dispatches cancel each other's runs.
#
# Scope matches the manual job's: `dune build @check` type-checks the whole
# tree, test/ included, and links nothing -- linking is this repo's slow
# step, and every breakage class this session produced (unbound values,
# signature mismatches, an mli-only type, a label that would not resolve)
# is a compile error @check reports.
#
# Concurrency is per PR, so a new push cancels only that PR's older run and
# parallel PRs leave each other alone.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The lint suite is one job on purpose. It used to be ~30 GitHub Actions
  # jobs, each paying its own checkout and apt setup, which queued whole PRs
  # for tens of minutes; scripts/ci/run-lint-suite.sh was written to collapse
  # them into a single sequential run that still reports every failure rather
  # than stopping at the first. That driver then ran nowhere: the 2026-09-02
  # collapse of the 9-job lane dropped lint along with the jobs, and the
  # driver was never re-attached (#33211).
  #
  # It is a job of its own rather than a step in `check` because it needs no
  # OCaml toolchain -- checkout, ripgrep, jq and python3 are the whole
  # dependency -- so it runs beside the build instead of behind the opam
  # switch, and a lint failure and a compile failure are reported
  # independently. Measured on the two PRs that introduced this job: lint
  # 5m31s and 5m28s, build 6m16s and 6m4s, in parallel. The saving is not
  # the lint job's own speed; it is that a lint verdict does not queue
  # behind a toolchain it never uses.
  #
  # Mode is `blocking-pr`: the 37 whole-tree lints plus six guards that read
  # the diff against the PR's base -- Fun.protect finalizers, ignore
  # justification on new sites, the RFC-0235 stale-base revert guard, and
  # the cancel guard. Those six were left out when this job landed because
  # lint-cancel-guard.sh reported five hits on main; #33229 closed them, so
  # they run now. The diff guards need the base commit present, hence
  # fetch-depth: 0.
  lint:
    name: lint suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Full history: the blocking-pr guards diff HEAD against the PR's
        # base sha, and a depth-1 checkout does not contain that commit.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the tools the lints call
        # 29 of the 40 lints call rg or jq, and yaml-syntax.sh imports PyYAML.
        # apt-refresh.sh bounds a hung mirror at 90s and fails open, the same
        # way release.yml uses it.
        run: |
          set -euo pipefail
          bash scripts/ci/apt-refresh.sh
          sudo apt-get install -y --no-install-recommends ripgrep jq python3-yaml

      - name: Blocking lints
        run: |
          bash scripts/ci/run-lint-suite.sh blocking-pr \
            "${{ github.event.pull_request.base.sha }}"

      - name: Advisory lints
        # Recorded, not enforced -- the driver's own contract for this mode.
        continue-on-error: true
        run: bash scripts/ci/run-lint-suite.sh advisory

  check:
    name: dune build @check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only the edited-test step below reads it, and it asks the pull
      # request API which files changed because a three-dot git diff cannot
      # answer that here: this job checks out at depth 1, so there is no
      # merge base and the answer would be the whole tree. Scoped to this
      # job so the lint job, which runs 37 scripts over pull request
      # content, does not carry it.
      pull-requests: read
    steps:
      - name: Free disk space
        # Same preinstalled bulk the manual CI removes for the same reason:
        # the opam switch plus _build does not fit beside the Android SDK,
        # .NET, GHC, and the CodeQL bundle (issue #22954).
        run: |
          set -euo pipefail
          cleanup_pids=()
          sudo rm -rf /usr/local/lib/android & cleanup_pids+=("$!")
          sudo rm -rf /usr/share/dotnet & cleanup_pids+=("$!")
          sudo rm -rf /opt/ghc /usr/local/.ghcup & cleanup_pids+=("$!")
          sudo rm -rf /opt/hostedtoolcache/CodeQL & cleanup_pids+=("$!")
          sudo docker image prune --all --force & cleanup_pids+=("$!")
          for cleanup_pid in "${cleanup_pids[@]}"; do
            wait "${cleanup_pid}" || true
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # check-doc-truth.sh compares the release the docs name with the
          # newest v* tag; a checkout with no tags cannot answer that.
          fetch-tags: true

      - name: Check source text integrity
        run: scripts/ci/check-source-text-integrity.sh

      # One RFC number names one document, and the index table is generated
      # from the frontmatter. The script refuses a number that two documents
      # claim and a table that differs from what the frontmatter says, so a
      # "RFC-NNNN §4.1" citation in the code names exactly one file. It reads
      # the checkout only, so it runs before the toolchain is set up.
      - name: Check RFC index
        run: scripts/rfc-generate-index.py --check

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml-toolchain

      - name: Pin external OCaml dependencies
        uses: ./.github/actions/pin-ocaml-deps
        with:
          pin-flags: --with-bisect

      - name: Install system and OCaml dependencies
        uses: ./.github/actions/install-ocaml-deps
        with:
          install-flags: --with-test
          os-packages: jq ripgrep

      # CONTRIBUTING names this gate and nothing ran it, so the version headers
      # drifted: the 0.30.0 release updated ROADMAP and left
      # docs/PRODUCT-OPERATING-PLAN.md and docs/spec/SPEC-INDEX.md on 0.29.1 for
      # a day. It reads checked-in text only, so it runs before the build and
      # after the step that installs the rg and jq it calls.
      - name: Check doc truth
        run: scripts/check-doc-truth.sh

      - name: Build
        env:
          DUNE_JOBS: "4"
        # NO continue-on-error: the build is deterministic and must hard-fail.
        run: |
          set -euo pipefail
          dune build @check

      # RFC-0428 step one. @check type-checks and links nothing, which is the
      # right trade for the whole tree and says nothing about whether an
      # assertion holds. Measured over 2026-09-06: five defects across five
      # TUI pull requests, @check caught one, and three of the four it missed
      # broke inside a test file the same pull request was editing.
      #
      # So this links only those and runs them. It is not the suite; 344
      # stanzas is the link cost the design above is buying and this does not
      # spend it. It runs here rather than in a job of its own because the
      # build cache it needs is the one the step above just filled.
      #
      # continue-on-error until main's red count is known. Gating on an
      # unknown number stops pull requests that changed nothing to do with it.
      - name: Run the tests this pull request edits
        continue-on-error: true
        # continue-on-error covers a failing step, not a job the runner
        # cancelled: timeout-minutes above ends the job and reports it
        # failed whatever a step says. So this bounds itself, and the script
        # bounds each suite it runs on top of that.
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          DUNE_JOBS: "4"
        run: |
          bash scripts/ci/run-edited-tests.sh \
            "${{ github.event.pull_request.number }}"

      # RFC-0428 step two. The step above runs what a pull request edits; this
      # runs a fixed set regardless, because the five defects found on
      # 2026-09-06 to 09-07 were not in a file their pull request touched.
      # Every one was a suite that had gone red days earlier and stayed red:
      # test_tui_row_wiring since 09-03, test_tool_name_prefix_boundary since
      # 09-03, test_pr_open_script since 09-01, and two in
      # test_tui_keeper_chat_history. Nothing was watching, because the
      # nightly that would have has not finished inside its deadline since at
      # least 09-04.
      #
      # A suite whose dune stanza names only unwrapped libraries under bin/,
      # test_lib/ or lib/ needs no masc, and therefore no build: the runner
      # compiles the modules it reaches with ocamlfind. 111 of the 1201
      # suites qualify; measured at 119-199 s locally depending on load, and
      # the other 1090 are named and skipped with the library that blocks
      # them. No dune, no _build, so this neither uses nor spoils the cache
      # the step above just filled.
      #
      # continue-on-error for one reason, which will expire: one of the 111 is
      # red on purpose. test_tool_name_prefix_boundary reports that
      # report_review_verdict sits outside the closed tool-name vocabulary
      # (#33778), and every way to settle that costs a deploy, so it is a
      # decision rather than a repair. Gating before it is made would block
      # pull requests that have nothing to do with it. When #33778 lands, this
      # becomes a gate by deleting one line.
      - name: Run the suites that need no build
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/run-standalone-suites.py --all-matching '*'

  # dashboard/ ships a `typecheck` script and no lane calls it.
  #
  # ci.yml's header records that its dashboard job was folded away on
  # 2026-09-02, and pr-check.yml never had one, so nothing type-checks the
  # 697 test files and 9445 tests under dashboard/. What that cost, measured
  # on 2026-09-06: #33454 left two TS2352 errors on main and they sat a full
  # day, found only because a baseline was taken by hand (#33548 repairs them).
  #
  # This is the type-check alone, not the suite. `pnpm typecheck` over the
  # whole dashboard is 8.7s locally. `pnpm test` is 481s in the single-worker
  # shape package.json pins, or 95s parallel with one test that starves under
  # load; RFC-0428 carries those numbers and the suite waits on that decision.
  # The type-check does not need to wait for it.
  dashboard-types:
    name: dashboard typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        # The toolchain release.yml builds the SPA with: node 22 + pnpm 10.31.0.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.31.0 --activate
          pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: dashboard
        # NO continue-on-error: main is green here once #33548 lands, and a
        # type error is deterministic. Do not merge this before that one.
        run: pnpm typecheck
